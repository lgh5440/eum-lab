<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이음 교육연구소 | E:UM Lab</title>
  <meta name="description" content="교회와 교육 현장을 위한 이음 교육연구소의 앱 소개와, 연구소가 직접 만들고 확인한 교육자료입니다.">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-page); color: var(--ink); font-family: var(--font-family-base); font-size: var(--font-size-body); line-height: var(--line-height-body); }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .hero { padding: clamp(32px, 7vw, 84px) 0 52px; }
    .hero-card, .section-card { background: var(--bg-surface); border: 1px solid rgba(var(--primary-blue-rgb), .14); border-radius: var(--radius-xl); box-shadow: var(--shadow-frame); }
    .hero-card { position: relative; overflow: hidden; padding: clamp(28px, 6vw, 64px); border: 3px solid transparent; background: linear-gradient(var(--bg-surface), var(--bg-surface)) padding-box, var(--rainbow-frame-gradient) border-box; }
    .hero-card::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -80px; border-radius: var(--radius-full); background: var(--bg-panel); opacity: .8; }
    .brand-center { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); }
    .brand-logo { width: clamp(120px, 24vw, 200px); height: auto; object-fit: contain; margin-bottom: var(--space-2); }
    .eyebrow { margin: 0; color: var(--primary-blue-deep); font-size: var(--font-size-label); font-weight: var(--font-weight-strong); letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); line-height: 1.15; letter-spacing: -.04em; }
    .tagline { margin: 4px 0 0; color: var(--primary-blue-deep); font-size: clamp(14px, 1.8vw, 18px); font-weight: var(--font-weight-strong); }
    .section { padding: 28px 0; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h2 { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: var(--line-height-tight); }
    .section-note { margin: 0; color: var(--ink-tertiary); font-size: var(--font-size-small); }
    .grid-single { display: grid; max-width: 480px; }
    .app-card { display: block; padding: 22px; text-decoration: none; background: var(--bg-surface); border: 1px solid rgba(var(--primary-blue-rgb), .16); border-radius: var(--radius-md); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .app-card:hover, .app-card:focus-visible { transform: translateY(-3px); border-color: var(--primary-blue-light); box-shadow: var(--shadow-cta); outline: none; }
    .app-card--all { text-align: center; padding: 32px 22px; }
    .app-card h3 { margin: 0 0 5px; font-size: 17px; line-height: var(--line-height-tight); }
    .app-card p { margin: 0; color: var(--ink-secondary); font-size: var(--font-size-caption); }
    .app-card .go { display: inline-block; margin-top: 15px; color: var(--primary-blue-deep); font-size: var(--font-size-small); font-weight: var(--font-weight-strong); }
    .materials-empty { padding: 40px 22px; text-align: center; color: var(--ink-tertiary); background: var(--bg-surface); border: 1px dashed rgba(var(--primary-blue-rgb), .25); border-radius: var(--radius-md); }
    footer { padding: 46px 0 64px; color: var(--ink-secondary); text-align: center; }
    footer a { color: var(--primary-blue-deep); font-weight: var(--font-weight-strong); }
    @media (max-width: 760px) { .wrap { width: min(100% - 24px, 620px); } .section-head { display: block; } .hero-card { padding: 28px 22px; } }
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="hero-card">
    <div class="brand-center">
      <img src="assets/eum-logo.png" alt="이음 E:UM 브랜드 로고" class="brand-logo">
      <p class="eyebrow">E:UM EDUCATION LAB</p>
      <h1>이음 교육연구소</h1>
      <p class="tagline">하나님과 사람을, 배움과 사역을 잇습니다.</p>
    </div>
  </div></div></header>

  <main class="wrap">
    <section class="section" aria-labelledby="apps-title"><div class="section-head"><h2 id="apps-title">이음 앱</h2></div>
      <div class="grid-single">
        <a class="app-card app-card--all" href="https://lgh5440.github.io/eum/" target="_blank" rel="noopener">
          <h3>이음 앱 모두 보기</h3>
          <p>이음이 만든 앱을 한곳에서 확인하세요.</p>
          <span class="go">모두 보기 ↗</span>
        </a>
      </div>
    </section>

    <section class="section" aria-labelledby="materials-title"><div class="section-head"><div><h2 id="materials-title">교육자료</h2></div></div>
      <div class="materials-empty"><p>준비중입니다.</p></div>
    </section>

  </main>
  <footer class="wrap"><p>이음 교육연구소와 함께 배움의 연결을 만듭니다.</p><a href="mailto:lgh544092@gmail.com">lgh544092@gmail.com</a></footer>
</body>
</html>

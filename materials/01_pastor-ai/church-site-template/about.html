<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교회 소개 — {교회이름}</title>
<meta name="description" content="교회 인사말과 우리가 소중히 여기는 가치, 그리고 걸어온 발자취를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main id="main">

  <div class="page-head">
    <div class="wrap">
      <h1>교회 소개</h1>
      <p data-site="한줄소개">우리 교회를 소개합니다</p>
    </div>
  </div>

  <!-- 인사말 -->
  <section class="section">
    <div class="wrap">
      <div class="greeting" id="greeting"></div>
    </div>
  </section>

  <!-- 소중히 여기는 것 -->
  <section class="section section-warm">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">OUR VALUES</span>
        <h2>우리가 소중히 여기는 것</h2>
      </div>
      <div class="grid grid-2" id="values"></div>
    </div>
  </section>

  <!-- 연혁 -->
  <section class="section" id="history-section">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">HISTORY</span>
        <h2>걸어온 길</h2>
      </div>
      <ul class="timeline" id="history"></ul>
    </div>
  </section>

  <!-- 처음 오시는 분께 -->
  <section class="section section-warm">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">FIRST VISIT</span>
        <h2>처음 오시는 분께</h2>
      </div>
      <div class="grid grid-2" id="faq-list"></div>
      <p class="more-link">
        <a class="btn btn-primary" href="worship.html">예배 시간 보기</a>
        <a class="btn btn-outline" href="location.html">오시는 길</a>
      </p>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/site-data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>

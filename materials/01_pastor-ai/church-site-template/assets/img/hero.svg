<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="해질녘, 불 켜진 작은 개척교회로 사람들이 걸어 들어가는 모습">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0E1723"/>
      <stop offset="0.30" stop-color="#22334A"/>
      <stop offset="0.55" stop-color="#4E4E5E"/>
      <stop offset="0.74" stop-color="#96674F"/>
      <stop offset="0.90" stop-color="#D9945F"/>
      <stop offset="1"    stop-color="#F0BE86"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFE3B4" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F6B472" stop-opacity="0.50"/>
      <stop offset="1"    stop-color="#F6B472" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2E2A2E"/>
      <stop offset="0.5" stop-color="#1C1C24"/>
      <stop offset="1"   stop-color="#12131A"/>
    </linearGradient>

    <linearGradient id="doorLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFCE90" stop-opacity="0.62"/>
      <stop offset="0.6" stop-color="#FFCE90" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#FFCE90" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFD79B" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFD79B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 하늘 -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 별 -->
  <g fill="#F5EFE4">
    <circle cx="180"  cy="90"  r="2.2" opacity=".75"/>
    <circle cx="360"  cy="52"  r="1.6" opacity=".55"/>
    <circle cx="520"  cy="140" r="1.9" opacity=".45"/>
    <circle cx="760"  cy="70"  r="1.5" opacity=".6"/>
    <circle cx="980"  cy="120" r="2"   opacity=".5"/>
    <circle cx="1240" cy="64"  r="1.7" opacity=".65"/>
    <circle cx="1420" cy="150" r="2.1" opacity=".45"/>
    <circle cx="1520" cy="60"  r="1.5" opacity=".55"/>
    <circle cx="640"  cy="196" r="1.4" opacity=".35"/>
    <circle cx="1090" cy="210" r="1.4" opacity=".3"/>
  </g>

  <!-- 저녁 해 -->
  <circle cx="1210" cy="612" r="320" fill="url(#sunGlow)"/>
  <circle cx="1210" cy="612" r="58"  fill="#FFE0AE" opacity=".9"/>

  <!-- 구름 -->
  <g fill="#8E6E63" opacity=".38">
    <ellipse cx="330"  cy="300" rx="215" ry="26"/>
    <ellipse cx="470"  cy="332" rx="150" ry="18"/>
    <ellipse cx="1230" cy="268" rx="250" ry="24"/>
    <ellipse cx="1060" cy="308" rx="140" ry="16"/>
  </g>
  <g fill="#E7A97A" opacity=".30">
    <ellipse cx="1300" cy="430" rx="290" ry="20"/>
    <ellipse cx="420"  cy="452" rx="220" ry="16"/>
  </g>

  <!-- 먼 산 -->
  <path d="M0 616 L210 520 L360 588 L520 500 L700 604 L860 548 L1040 610 L1240 534 L1420 600 L1600 552 L1600 660 L0 660 Z"
        fill="#1B2634" opacity=".85"/>
  <path d="M0 648 L180 596 L340 640 L560 580 L760 646 L980 604 L1180 650 L1400 606 L1600 644 L1600 700 L0 700 Z"
        fill="#141C27" opacity=".92"/>

  <!-- 땅 -->
  <rect x="0" y="662" width="1600" height="238" fill="url(#ground)"/>

  <!-- 문에서 흘러나오는 빛 -->
  <path d="M778 662 L822 662 L980 900 L620 900 Z" fill="url(#doorLight)"/>

  <!-- 작은 개척교회 -->
  <g>
    <!-- 창문에서 새어나오는 빛무리 -->
    <ellipse cx="800" cy="580" rx="230" ry="130" fill="url(#windowGlow)"/>

    <!-- 본당 몸체 -->
    <rect x="700" y="500" width="200" height="164" fill="#14202C"/>
    <!-- 지붕 -->
    <path d="M684 504 L800 424 L916 504 Z" fill="#0F1922"/>
    <path d="M684 504 L916 504 L916 516 L684 516 Z" fill="#0B141C"/>

    <!-- 종탑 -->
    <rect x="762" y="332" width="76" height="96" fill="#14202C"/>
    <path d="M752 334 L800 288 L848 334 Z" fill="#0F1922"/>
    <!-- 종탑 작은 창 -->
    <rect x="784" y="356" width="32" height="44" rx="16" fill="#FFC98A" opacity=".85"/>

    <!-- 십자가 -->
    <rect x="795" y="228" width="10" height="62" fill="#F3E3CC"/>
    <rect x="780" y="248" width="40" height="10" fill="#F3E3CC"/>

    <!-- 본당 창문 (따뜻한 불빛) -->
    <g fill="#FFC98A">
      <path d="M722 552 h34 a17 17 0 0 1 17 17 v62 h-68 v-62 a17 17 0 0 1 17 -17 z" opacity=".92"/>
      <path d="M844 552 h34 a17 17 0 0 1 17 17 v62 h-68 v-62 a17 17 0 0 1 17 -17 z" opacity=".92"/>
    </g>
    <!-- 창틀 -->
    <g stroke="#14202C" stroke-width="4">
      <line x1="739" y1="552" x2="739" y2="631"/>
      <line x1="705" y1="592" x2="773" y2="592"/>
      <line x1="861" y1="552" x2="861" y2="631"/>
      <line x1="827" y1="592" x2="895" y2="592"/>
    </g>

    <!-- 열린 문 -->
    <path d="M778 662 v-72 a22 22 0 0 1 44 0 v72 z" fill="#FFD9A2" opacity=".95"/>
    <path d="M800 662 v-94 a22 22 0 0 0 -22 22 v72 z" fill="#E8B57C" opacity=".55"/>

    <!-- 소박한 현판 -->
    <rect x="756" y="470" width="88" height="16" rx="3" fill="#8C6A4E" opacity=".75"/>
  </g>

  <!-- 나무 -->
  <g fill="#101A24">
    <path d="M300 662 l-8 -54 l-22 4 l24 -34 l-16 2 l24 -40 l24 40 l-16 -2 l24 34 l-22 -4 l-8 54 z"/>
    <path d="M1348 662 l-7 -46 l-19 4 l21 -30 l-14 2 l21 -35 l21 35 l-14 -2 l21 30 l-19 -4 l-7 46 z"/>
    <path d="M1442 662 l-5 -34 l-14 3 l16 -22 l-10 1 l15 -26 l15 26 l-10 -1 l16 22 l-14 -3 l-5 34 z"/>
  </g>

  <!-- 낮은 울타리 -->
  <g stroke="#0E1720" stroke-width="5" opacity=".9">
    <line x1="120" y1="640" x2="120" y2="668"/>
    <line x1="160" y1="642" x2="160" y2="668"/>
    <line x1="200" y1="640" x2="200" y2="668"/>
    <line x1="240" y1="642" x2="240" y2="668"/>
    <line x1="110" y1="648" x2="250" y2="648"/>
  </g>

  <!-- 교회로 걸어가는 사람들 -->
  <g fill="#0C141C">
    <!-- 어른 -->
    <g transform="translate(560 662) scale(1.15)">
      <circle cx="0" cy="-58" r="9"/>
      <path d="M-9 -46 q9 -6 18 0 l4 26 l-8 0 l-2 24 l-6 0 l-2 -22 l-2 22 l-6 0 l-2 -24 l-8 0 z"/>
    </g>
    <!-- 아이 (손 잡은 느낌) -->
    <g transform="translate(592 662) scale(0.78)">
      <circle cx="0" cy="-56" r="9"/>
      <path d="M-9 -44 q9 -6 18 0 l4 24 l-8 0 l-2 22 l-6 0 l-2 -20 l-2 20 l-6 0 l-2 -22 l-8 0 z"/>
    </g>
    <!-- 뒤따라오는 두 사람 -->
    <g transform="translate(456 664) scale(1.02)" opacity=".9">
      <circle cx="0" cy="-56" r="9"/>
      <path d="M-9 -44 q9 -6 18 0 l4 25 l-8 0 l-2 23 l-6 0 l-2 -21 l-2 21 l-6 0 l-2 -23 l-8 0 z"/>
    </g>
    <g transform="translate(1012 664) scale(1.0)" opacity=".85">
      <circle cx="0" cy="-56" r="9"/>
      <path d="M-9 -44 q9 -6 18 0 l4 25 l-8 0 l-2 23 l-6 0 l-2 -21 l-2 21 l-6 0 l-2 -23 l-8 0 z"/>
    </g>
  </g>

  <!-- 문 앞 흙길 -->
  <path d="M800 664 C 760 740, 700 820, 640 900 L 980 900 C 900 812, 842 736, 800 664 Z"
        fill="#3A3128" opacity=".35"/>

  <!-- 새 -->
  <g stroke="#0E1720" stroke-width="3" fill="none" opacity=".55">
    <path d="M1090 196 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M1178 154 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M420 178 q10 -9 20 0 q10 -9 20 0"/>
  </g>

  <!-- 아래쪽 어둠 (글씨가 잘 보이도록) -->
  <rect x="0" y="760" width="1600" height="140" fill="#0D131B" opacity=".45"/>
</svg>
